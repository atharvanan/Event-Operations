services:
  mongodb:
    image: mongo:7.0
    container_name: eventops-mongo
    restart: always
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=event_operations

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eventops-backend
    restart: always
    ports:
      - '5000:5000'
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/event_operations
      - JWT_SECRET=local_dev_docker_secret_32_characters_long
      - CORS_ORIGIN=http://localhost:3000
    depends_on:
      - mongodb
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eventops-frontend
    restart: always
    ports:
      - '3000:3000'
    environment:
      - BACKEND_INTERNAL_URL=http://backend:5000
      - NEXT_PUBLIC_API_URL=/api/v1
      - NEXT_PUBLIC_SOCKET_URL=/
    depends_on:
      - backend

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: eventops-tunnel
    restart: always
    command: tunnel --url http://frontend:3000
    depends_on:
      - frontend

volumes:
  mongo-data:
